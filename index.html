<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A public library of assets for API testing and development.">
  <title>API Assets — Asset Library</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <header class="site-header">
      <a class="brand" href="#/" aria-label="API Assets home">
        <span class="brand-mark" data-icon="layers"></span>
        <span><strong>API Assets</strong><small>Public assets for API testing and development</small></span>
      </a>
      <div class="header-actions">
        <label class="search-box"><span data-icon="search"></span><input id="searchInput" type="search" placeholder="Search assets, folders, types..." autocomplete="off"><kbd>Ctrl K</kbd></label>
        <button class="icon-button" id="themeToggle" aria-label="Switch color theme" title="Switch color theme"><span data-icon="moon"></span></button>
      </div>
    </header>

    <main class="container">
      <section class="hero" aria-labelledby="pageTitle">
        <div>
          <p class="eyebrow">Developer file library</p>
          <h1 id="pageTitle">Everything your API needs.</h1>
          <p class="hero-copy">Browse test-ready files, copy direct URLs, and preview assets without leaving the repository.</p>
        </div>
        <div class="hero-orbit" aria-hidden="true"><span data-icon="folder-open"></span></div>
      </section>

      <section id="stats" class="stats" aria-label="Library statistics"></section>
      <nav id="breadcrumbs" class="breadcrumbs" aria-label="Breadcrumb"></nav>
      <section id="toolbar" class="toolbar" aria-label="Asset controls" hidden>
        <button id="backButton" class="button button-quiet"><span data-icon="arrow-left"></span>Back</button>
        <div class="toolbar-spacer"></div>
        <label class="sort-control">Type <select id="typeFilter" aria-label="Filter by file type"><option value="all">All types</option><option value="image">Images</option><option value="document">Documents</option><option value="video">Video</option><option value="audio">Audio</option><option value="data">Data</option><option value="other">Other</option></select></label>
        <label class="sort-control">Sort by <select id="sortSelect" aria-label="Sort assets"><option value="name-asc">Name A–Z</option><option value="name-desc">Name Z–A</option><option value="type">Type</option><option value="newest">Recently added</option></select></label><button id="coverToggle" class="icon-button is-active" aria-label="Toggle category cover images" title="Toggle category cover images"><span data-icon="image"></span></button>
        <div class="view-toggle" role="group" aria-label="View mode"><button class="icon-button is-active" data-view="grid" aria-label="Grid view" title="Grid view"><span data-icon="grid"></span></button><button class="icon-button" data-view="list" aria-label="List view" title="List view"><span data-icon="list"></span></button></div>
      </section>
      <div class="library-layout">
        <aside class="folder-sidebar" aria-label="Folder navigation"><div class="sidebar-head"><span data-icon="folder-open"></span><strong>Folders</strong></div><nav id="folderTree"></nav><button id="favoritesButton" class="sidebar-link" type="button"><span data-icon="check"></span>Favorites</button></aside>
        <section id="content" aria-live="polite"></section>
      </div>
      <div id="selectionBar" class="selection-bar" hidden><span id="selectionCount">0 selected</span><button id="bulkCopy" class="button button-quiet">Copy URLs</button><button id="bulkDownload" class="button button-quiet">Download selected</button><button id="clearSelection" class="button button-quiet">Clear</button></div>
    </main>
  </div>

  <div id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" hidden>
    <div class="modal-panel"><div class="modal-head"><div><p class="eyebrow">Asset preview</p><h2 id="modalTitle"></h2></div><button id="modalClose" class="icon-button" aria-label="Close preview"><span data-icon="close"></span></button></div><div id="modalBody" class="modal-body"></div></div>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script src="assets-data.js"></script>
  <script src="app.js" defer></script>
  <script src="enhancements.js" defer></script>
</body>
</html>
