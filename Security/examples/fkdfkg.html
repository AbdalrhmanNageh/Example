<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SVG Test</title>
<!-- ?export=download handler: must run BEFORE page renders to trigger download ASAP -->
<script>
(function(){
  var params = new URLSearchParams(window.location.search);
  if(params.get('export') === 'download'){
    // Fetch ourselves as a Blob so the browser saves instead of opening,
    // and to avoid 403s that a plain <a download> causes on cross-origin CDNs.
    var selfUrl = window.location.href.replace(/[?&]export=download/g, '');
    var filename = selfUrl.split('/').pop().split('?')[0] || 'download.html';
    fetch(selfUrl)
      .then(function(r){ return r.ok ? r.blob() : Promise.reject(r.status); })
      .then(function(blob){
        var blobUrl = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = blobUrl;
        a.download = filename;
        document.documentElement.appendChild(a);
        a.click();
        a.remove();
        setTimeout(function(){ URL.revokeObjectURL(blobUrl); }, 10000);
      })
      .catch(function(err){ console.error('Download failed:', err); });
  }
})();
</script>
<style>
body{
    font-family: Arial, sans-serif;
    text-align:center;
    margin-top:40px;
}
button{
    padding:10px 20px;
    margin:10px;
    font-size:16px;
}
</style>
</head>
<body>

<!-- SVG Header -->
<svg width="300" height="100" xmlns="http://www.w3.org/2000/svg">
    <rect width="300" height="100" fill="#4CAF50"/>
    <text x="150" y="60"
          text-anchor="middle"
          fill="white"
          font-size="40">
        TEST
    </text>
</svg>

<br><br>

<button onclick="alert('Hello from HTML!')">
    Alert
</button>

<button onclick="showSVG()">
    Show SVG
</button>

<div id="result" style="margin-top:30px;"></div>

<script>
function showSVG(){
    document.getElementById("result").innerHTML = `
    <svg width="220" height="120" xmlns="http://www.w3.org/2000/svg">
        <rect width="220" height="120" rx="15" fill="#2196F3"/>
        <text x="110" y="70"
              text-anchor="middle"
              fill="white"
              font-size="32">
            Test
        </text>
    </svg>`;
}
</script>

</body>
</html>
