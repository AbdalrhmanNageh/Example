<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SVG Test</title>
<!-- ?export=download: two-layer approach for reliable auto-download -->
<script>
/*
 * LAYER 1 - Service Worker (handles future visits at HTTP level):
 * After this SW is installed, any request to this file with ?export=download
 * will be intercepted BEFORE the page loads. The SW fetches the clean URL
 * and returns it with Content-Disposition: attachment, so the browser saves
 * the file automatically with zero JavaScript involvement.
 * sw.js is at the project root (two levels up from Security/examples/).
 */
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('../../sw.js').catch(function(){});
}

/*
 * LAYER 2 - First-visit fallback (no fetch, no async, no blocker):
 * On the FIRST visit, the SW is not yet active, so we fall back to reading
 * the page's own DOM via document.documentElement.outerHTML and creating a
 * Blob from it. This is 100% synchronous — Chrome cannot block it because
 * there is no async fetch call. The Blob URL is same-origin so download works.
 */
(function () {
  if (new URLSearchParams(location.search).get('export') !== 'download') return;

  /* If SW is already controlling this page, it will handle it - skip fallback */
  if (navigator.serviceWorker && navigator.serviceWorker.controller) return;

  function triggerDownload() {
    var name = location.pathname.split('/').pop() || 'download.html';
    /* Serialize the full rendered DOM to a string */
    var html = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
    var blob = new Blob([html], { type: 'text/html;charset=utf-8' });
    var blobUrl = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = blobUrl;
    a.download = name;
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(blobUrl); }, 60000);
  }

  /* Wait for DOMContentLoaded so document.body exists */
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', triggerDownload);
  } else {
    triggerDownload();
  }
})();
</script>
<style>
body{
    font-family: Arial, sans-serif;
    text-align:center;
    margin-top:40px;
}
button{
    padding:10px 20px;

}
</style>
</head>

<!-- SVG Header -->
<svg width="300" height="100" xmlns="http://www.w3.org/2000/svg">

    <text x="150" y="60"
          text-anchor="middle"
          fill="white"
          font-size="40">

    </text>
</svg>

<button onclick="alert('Hello from HTML!')">
    Alert
</button>

<button onclick="showSVG()">
    Show SVG
</button>

<div id="result" style="margin-top:30px;"></div>

<script>
function showSVG(){
    document.getElementById("result").innerHTML = `
    <svg width="220" height="120" xmlns="http://www.w3.org/2000/svg">
        <rect width="220" height="120" rx="15" fill="#2196F3"/>
        <text x="110" y="70"
              text-anchor="middle"
              fill="white"
              font-size="32">
            Test
        </text>
    </svg>`;
}
</script>
